<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>小学二升三暑假养宠大作战</title>
  <style>
/* ========================================
   小学二升三暑假养宠大作战 - 样式表
   ======================================== */

/* ===== CSS 变量 ===== */
:root {
  --primary: #6C5CE7;
  --primary-light: #A29BFE;
  --primary-dark: #4834D4;
  --accent: #FDCB6E;
  --accent-light: #FFEAA7;
  --success: #00B894;
  --danger: #FF6B6B;
  --warning: #FDCB6E;
  --bg-main: #F0F3FF;
  --bg-card: #FFFFFF;
  --bg-soft: #F8F9FE;
  --text-main: #2D3436;
  --text-soft: #636E72;
  --text-light: #B2BEC3;
  --border: #DFE6E9;
  --shadow-sm: 0 2px 8px rgba(108, 92, 231, 0.08);
  --shadow-md: 0 4px 16px rgba(108, 92, 231, 0.12);
  --shadow-lg: 0 8px 32px rgba(108, 92, 231, 0.16);
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-xl: 28px;
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

/* ===== 重置 ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: "Comic Sans MS", "微软雅黑", "Microsoft YaHei", sans-serif;
  background: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  overflow-x: hidden;
}

/* 背景装饰 */
body::before {
  content: '';
  position: fixed;
  top: -200px;
  right: -200px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(162,155,254,0.15) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
}

body::after {
  content: '';
  position: fixed;
  bottom: -200px;
  left: -200px;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(253,203,110,0.12) 0%, transparent 70%);
  border-radius: 50%;
  z-index: 0;
  pointer-events: none;
}

/* ===== 顶部导航栏 ===== */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 24px;
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
  color: white;
  box-shadow: var(--shadow-md);
}

.topbar-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  font-size: 22px;
  font-weight: bold;
  text-shadow: 0 2px 4px rgba(0,0,0,0.15);
}

.grade-badge {
  background: var(--accent);
  color: var(--primary-dark);
  padding: 3px 12px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.topbar-right {
  display: flex;
  align-items: center;
  gap: 16px;
}

.coin-display {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.2);
  padding: 6px 16px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: bold;
  transition: var(--transition);
}

.coin-display.bounce {
  animation: coinBounce 0.5s ease;
}

@keyframes coinBounce {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

.coin-icon {
  font-size: 20px;
}

.streak-display {
  display: flex;
  align-items: center;
  gap: 4px;
  background: rgba(255,255,255,0.2);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 15px;
  font-weight: bold;
}

.date-display {
  font-size: 14px;
  opacity: 0.85;
}

.topbar-name {
  font-size: 16px;
  font-weight: bold;
  padding: 4px 14px;
  background: rgba(255,255,255,0.25);
  border-radius: 16px;
  letter-spacing: 1px;
}

.settings-entry-btn {
  background: rgba(255,255,255,0.25);
  border: none;
  color: white;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  font-size: 18px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.settings-entry-btn:hover {
  background: rgba(255,255,255,0.45);
  transform: rotate(45deg);
}

/* ===== 标签导航 ===== */
.tab-nav {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 16px 24px 8px;
  position: relative;
  z-index: 10;
  flex-wrap: wrap;
}

.tab-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 10px 20px;
  border: none;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow-sm);
  color: var(--text-soft);
  min-width: 90px;
}

.tab-btn:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.tab-btn.active {
  background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
  color: white;
  box-shadow: var(--shadow-md);
  transform: translateY(-2px);
}

.tab-icon {
  font-size: 24px;
}

.tab-label {
  font-size: 13px;
  font-weight: bold;
}

/* ===== 主内容区 ===== */
.main-content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 8px 24px 40px;
  position: relative;
  z-index: 1;
}

.tab-panel {
  display: none;
  animation: fadeInUp 0.4s ease;
}

.tab-panel.active {
  display: block;
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 20px;
}

.panel-header h2 {
  font-size: 24px;
  color: var(--text-main);
}

.panel-subtitle {
  font-size: 14px;
  color: var(--text-soft);
  width: 100%;
}

/* ===== 今日任务 ===== */
.daily-progress {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 15px;
  font-weight: bold;
  color: var(--text-soft);
}

.progress-bar {
  width: 150px;
  height: 12px;
  background: var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--success), #55EFC4);
  border-radius: 10px;
  transition: width 0.5s ease;
}

.task-groups {
  display: flex;
  flex-direction: column;
  gap: 20px;
  margin-bottom: 24px;
}

.task-group {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}

.task-group-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  font-size: 16px;
  font-weight: bold;
}

.task-group-header .group-icon {
  font-size: 22px;
}

.task-group-header .group-name {
  color: var(--text-main);
}

.task-group-header .group-count {
  margin-left: auto;
  font-size: 13px;
  color: var(--text-light);
  font-weight: normal;
}

.task-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.task-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: var(--bg-soft);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  border: 2px solid transparent;
  user-select: none;
}

.task-card:hover {
  border-color: var(--primary-light);
  transform: translateX(4px);
}

.task-card.completed {
  background: linear-gradient(135deg, #E8F8F5, #D5F4EE);
  border-color: var(--success);
}

.task-checkbox {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 3px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: var(--transition);
  font-size: 16px;
}

.task-card.completed .task-checkbox {
  background: var(--success);
  border-color: var(--success);
  color: white;
}

.task-icon {
  font-size: 24px;
  flex-shrink: 0;
}

.task-info {
  flex: 1;
}

.task-name {
  font-size: 15px;
  font-weight: bold;
  color: var(--text-main);
}

.task-card.completed .task-name {
  text-decoration: line-through;
  color: var(--text-light);
}

.task-reward {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--accent-light);
  padding: 4px 10px;
  border-radius: 12px;
  font-size: 14px;
  font-weight: bold;
  color: #B8860B;
  flex-shrink: 0;
}

.task-card.completed .task-reward {
  background: #E8F8F5;
  color: var(--success);
}

/* 每日汇总 */
.daily-summary {
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}

.summary-card {
  flex: 1;
  min-width: 160px;
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg-card);
  padding: 16px 20px;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  font-size: 15px;
  color: var(--text-soft);
}

.summary-card strong {
  font-size: 22px;
  color: var(--primary);
}

.summary-icon {
  font-size: 28px;
}

/* ===== 宠物家园 ===== */
.pet-home-empty {
  text-align: center;
  padding: 60px 20px;
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.pet-home-empty .empty-icon {
  font-size: 80px;
  margin-bottom: 16px;
  display: block;
}

.pet-home-empty h3 {
  font-size: 20px;
  color: var(--text-main);
  margin-bottom: 8px;
}

.pet-home-empty p {
  color: var(--text-soft);
  margin-bottom: 20px;
}

.btn-primary {
  display: inline-block;
  padding: 12px 28px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  border: none;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: var(--transition);
  box-shadow: var(--shadow-md);
  font-family: inherit;
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.btn-primary:active {
  transform: translateY(0);
}

.pet-home-main {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 20px;
}

@media (max-width: 768px) {
  .pet-home-main {
    grid-template-columns: 1fr;
  }
}

.pet-display-area {
  background: linear-gradient(135deg, #E8F0FE, #F0E8FE);
  border-radius: var(--radius-lg);
  padding: 30px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
}

/* 喂食/玩耍动画期间允许溢出 */
.pet-display-area.animating {
  overflow: visible;
}

.pet-display-area::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 80px;
  background: linear-gradient(180deg, transparent, rgba(108,92,231,0.08));
}

/* ===== 3D 球体宠物包装 ===== */
.pet-3d-wrapper {
  display: inline-block;
  position: relative;
  z-index: 1;
}
.pet-3d-wrapper::after {
  content: '';
  position: absolute;
  bottom: -4px;
  left: 15%;
  right: 15%;
  height: 12px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.15) 0%, transparent 70%);
  border-radius: 50%;
  z-index: -1;
  transition: all 0.35s cubic-bezier(0.34,1.56,0.64,1);
}
.pet-3d-wrapper:hover::after {
  bottom: -2px;
  left: 25%;
  right: 25%;
  height: 6px;
  background: radial-gradient(ellipse, rgba(0,0,0,0.1) 0%, transparent 70%);
}

.pet-emoji-large {
  font-size: 120px;
  line-height: 1.4;
  display: inline-block;
  position: relative;
  z-index: 1;
  cursor: pointer;
  /* 3D 球体 */
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.25) 40%, rgba(0,0,0,0.06) 100%);
  border-radius: 50%;
  padding: 16px 24px;
  transform: rotateX(8deg) rotateY(-6deg);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.12),
    0 2px 6px rgba(0,0,0,0.06),
    inset 0 -10px 24px rgba(0,0,0,0.08),
    inset 0 6px 12px rgba(255,255,255,0.55);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.35s ease;
  animation: petBounce3D 3s ease-in-out infinite;
}
.pet-emoji-large:hover {
  transform: rotateX(0) rotateY(0) scale(1.15);
  box-shadow:
    0 12px 32px rgba(0,0,0,0.18),
    0 4px 10px rgba(0,0,0,0.1),
    inset 0 -6px 16px rgba(0,0,0,0.05),
    inset 0 6px 14px rgba(255,255,255,0.7);
  animation: petBounce3DHover 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

/* 稀有度光晕 */
.pet-emoji-large[data-rarity="稀有"] { box-shadow: 0 6px 20px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06), 0 0 14px rgba(74,144,217,0.35), inset 0 -10px 24px rgba(0,0,0,0.08), inset 0 6px 12px rgba(255,255,255,0.55); }
.pet-emoji-large[data-rarity="稀有"]:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.1), 0 0 22px rgba(74,144,217,0.5), inset 0 -6px 16px rgba(0,0,0,0.05), inset 0 6px 14px rgba(255,255,255,0.7); }
.pet-emoji-large[data-rarity="史诗"] { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.7) 0%, rgba(200,170,255,0.25) 40%, rgba(130,70,200,0.12) 100%); box-shadow: 0 6px 20px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06), 0 0 18px rgba(155,89,182,0.45), inset 0 -10px 24px rgba(0,0,0,0.08), inset 0 6px 12px rgba(255,255,255,0.5); }
.pet-emoji-large[data-rarity="史诗"]:hover { box-shadow: 0 12px 32px rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.1), 0 0 28px rgba(155,89,182,0.6), inset 0 -6px 16px rgba(0,0,0,0.05), inset 0 6px 14px rgba(255,255,255,0.65); }
.pet-emoji-large[data-rarity="传说"] { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.7) 0%, rgba(255,220,150,0.3) 40%, rgba(200,140,30,0.15) 100%); box-shadow: 0 6px 22px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06), 0 0 22px rgba(243,156,18,0.5), inset 0 -10px 24px rgba(0,0,0,0.08), inset 0 6px 12px rgba(255,255,255,0.5); animation: petBounce3D 3s ease-in-out infinite, glowPulse 2.5s ease-in-out infinite; }
.pet-emoji-large[data-rarity="传说"]:hover { box-shadow: 0 14px 38px rgba(0,0,0,0.18), 0 4px 10px rgba(0,0,0,0.1), 0 0 35px rgba(243,156,18,0.7), inset 0 -6px 16px rgba(0,0,0,0.05), inset 0 6px 14px rgba(255,255,255,0.65); }

@keyframes petBounce3D {
  0%, 100% { transform: rotateX(8deg) rotateY(-6deg) translateY(0); }
  50% { transform: rotateX(8deg) rotateY(-6deg) translateY(-8px); }
}
@keyframes petBounce3DHover {
  0% { transform: rotateX(8deg) rotateY(-6deg) scale(1); }
  40% { transform: rotateX(-2deg) rotateY(3deg) scale(1.18); }
  100% { transform: rotateX(0) rotateY(0) scale(1.15); }
}
@keyframes glowPulse {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(243,156,18,0.3)); }
  50% { filter: drop-shadow(0 0 14px rgba(243,156,18,0.6)); }
}

.pet-adult-img {
  width: 120px;
  height: 120px;
  object-fit: contain;
  display: inline-block;
  position: relative;
  z-index: 1;
  border-radius: 50%;
  /* 3D 效果 */
  transform: rotateX(8deg) rotateY(-6deg);
  box-shadow:
    0 6px 20px rgba(0,0,0,0.12),
    0 2px 6px rgba(0,0,0,0.06),
    inset 0 -10px 24px rgba(0,0,0,0.08),
    inset 0 6px 12px rgba(255,255,255,0.35);
  transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1),
              box-shadow 0.35s ease;
  animation: petBounce3D 3s ease-in-out infinite;
}
.pet-adult-img:hover {
  transform: rotateX(0) rotateY(0) scale(1.15);
  box-shadow:
    0 12px 32px rgba(0,0,0,0.18),
    0 4px 10px rgba(0,0,0,0.1),
    inset 0 -6px 16px rgba(0,0,0,0.05),
    inset 0 6px 14px rgba(255,255,255,0.5);
  animation: petBounce3DHover 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
}

.pet-name-large {
  font-size: 26px;
  font-weight: bold;
  margin-top: 12px;
  color: var(--text-main);
}

.pet-rarity-badge {
  display: inline-block;
  padding: 3px 12px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: bold;
  margin-top: 6px;
}

.pet-mood {
  font-size: 18px;
  margin-top: 8px;
}

.pet-stats {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 20px;
  position: relative;
  z-index: 1;
}

.pet-stat {
  display: flex;
  align-items: center;
  gap: 8px;
}

.pet-stat-icon {
  font-size: 20px;
  width: 28px;
  text-align: center;
}

.pet-stat-bar {
  flex: 1;
  height: 16px;
  background: var(--border);
  border-radius: 10px;
  overflow: hidden;
  position: relative;
}

.pet-stat-fill {
  height: 100%;
  border-radius: 10px;
  transition: width 0.5s ease;
}

.pet-stat-fill.hunger {
  background: linear-gradient(90deg, #FF6B6B, #FF8E53);
}

.pet-stat-fill.happiness {
  background: linear-gradient(90deg, #FDCB6E, #FFEAA7);
}

.pet-stat-fill.energy {
  background: linear-gradient(90deg, #00B894, #55EFC4);
}

.pet-stat-text {
  font-size: 13px;
  font-weight: bold;
  min-width: 35px;
  text-align: right;
}

.pet-actions {
  display: flex;
  gap: 12px;
  margin-top: 20px;
  justify-content: center;
  position: relative;
  z-index: 1;
}

.pet-action-btn {
  padding: 10px 24px;
  border: none;
  border-radius: 20px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  display: flex;
  align-items: center;
  gap: 6px;
}

.pet-action-btn.feed {
  background: #FFF3CD;
  color: #856404;
}

.pet-action-btn.feed:hover {
  background: #FFE69C;
  transform: translateY(-2px);
}

.pet-action-btn.play {
  background: #D4EDDA;
  color: #155724;
}

.pet-action-btn.play:hover {
  background: #B1DFBB;
  transform: translateY(-2px);
}

.pet-action-btn.recycle {
  background: #FFF3CD;
  color: #856404;
}

.pet-action-btn.recycle:hover {
  background: #FFE69C;
  transform: translateY(-2px);
}

.btn-secondary {
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius-sm);
  background: #E0E0E0;
  color: #555;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.btn-secondary:hover { background: #D0D0D0; }

.btn-danger {
  padding: 10px 24px;
  border: none;
  border-radius: var(--radius-sm);
  background: #E74C3C;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.btn-danger:hover { background: #C0392B; }

.pet-action-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ===== 宠物成长阶段 ===== */
.pet-growth-badge {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: bold;
  background: #E8F8F5;
  color: #1ABC9C;
  margin-top: 4px;
}

.pet-growth-bar-wrap {
  margin-top: 8px;
  width: 100%;
  max-width: 220px;
  position: relative;
  z-index: 1;
}

.pet-growth-bar {
  width: 100%;
  height: 8px;
  background: var(--border);
  border-radius: 4px;
  overflow: hidden;
}

.pet-growth-fill {
  height: 100%;
  background: linear-gradient(90deg, #1ABC9C, #2ECC71);
  border-radius: 4px;
  transition: width 0.5s ease;
}

.pet-growth-label {
  font-size: 11px;
  color: var(--text-soft);
  margin-top: 4px;
  display: block;
  text-align: center;
}

/* ===== 喂食互动动画 ===== */
@keyframes feedBounce {
  0% { transform: translateY(0) scale(1); }
  15% { transform: translateY(-20px) scale(1.2); }
  30% { transform: translateY(0) scale(0.9); }
  45% { transform: translateY(-10px) scale(1.1); }
  60% { transform: translateY(0) scale(0.95); }
  75% { transform: translateY(-5px) scale(1.05); }
  100% { transform: translateY(0) scale(1); }
}

@keyframes playSpin {
  0% { transform: translateY(0) rotate(0deg) scale(1); }
  25% { transform: translateY(-15px) rotate(15deg) scale(1.15); }
  50% { transform: translateY(0) rotate(-10deg) scale(0.9); }
  75% { transform: translateY(-8px) rotate(5deg) scale(1.1); }
  100% { transform: translateY(0) rotate(0deg) scale(1); }
}

/* 飘浮爱心 */
.floating-heart {
  position: absolute;
  bottom: 60%;
  pointer-events: none;
  z-index: 10;
  animation: floatHeartUp 1.5s ease-out forwards;
}

@keyframes floatHeartUp {
  0% {
    transform: translateY(0) scale(0.5) rotate(0deg);
    opacity: 1;
  }
  50% {
    transform: translateY(-50px) scale(1.2) rotate(10deg);
    opacity: 0.8;
  }
  100% {
    transform: translateY(-120px) scale(0.3) rotate(-20deg);
    opacity: 0;
  }
}

/* 食物粒子 */
.feed-particle {
  position: absolute;
  bottom: 50%;
  pointer-events: none;
  z-index: 10;
  font-size: 20px;
  animation: particleFly 1.2s ease-out forwards;
}

@keyframes particleFly {
  0% {
    transform: translateY(0) scale(1) rotate(0deg);
    opacity: 1;
  }
  60% {
    transform: translateY(-60px) scale(1.8) rotate(45deg);
    opacity: 0.6;
  }
  100% {
    transform: translateY(-100px) scale(0.2) rotate(90deg);
    opacity: 0;
  }
}

/* 宠物说话气泡 */
.pet-speech-bubble {
  position: absolute;
  top: 5%;
  left: 50%;
  transform: translateX(-50%);
  background: white;
  border: 2px solid var(--primary);
  border-radius: 16px;
  padding: 6px 14px;
  font-size: 14px;
  font-weight: bold;
  color: var(--text-main);
  white-space: nowrap;
  z-index: 20;
  animation: bubblePop 0.3s ease, bubbleFloat 2s ease-in-out;
  box-shadow: 0 4px 12px rgba(108,92,231,0.15);
}

.pet-speech-bubble::after {
  content: '';
  position: absolute;
  bottom: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-top: 8px solid var(--primary);
}

@keyframes bubblePop {
  0% { transform: translateX(-50%) scale(0); }
  70% { transform: translateX(-50%) scale(1.1); }
  100% { transform: translateX(-50%) scale(1); }
}

@keyframes bubbleFloat {
  0%, 100% { transform: translateX(-50%) translateY(0); }
  50% { transform: translateX(-50%) translateY(-6px); }
}

/* 宠物列表 */
.pet-sidebar {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.pet-sidebar h3 {
  font-size: 16px;
  color: var(--text-main);
  padding-left: 4px;
}

.pet-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 400px;
  overflow-y: auto;
}

.pet-list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  border: 2px solid transparent;
  box-shadow: var(--shadow-sm);
}

.pet-list-item:hover {
  border-color: var(--primary-light);
}

.pet-list-item.active {
  border-color: var(--primary);

}

.pet-list-item .pet-list-emoji {
  font-size: 28px;
  display: inline-block;
  /* 迷你 3D */
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.1) 50%, rgba(0,0,0,0.03) 100%);
  border-radius: 50%;

  transform: rotateX(5deg) rotateY(-3deg);

  transition: transform 0.25s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.25s;
}
.pet-list-item .pet-list-emoji:hover {

}
.pet-list-item .pet-list-emoji[data-rarity="稀有"] { box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 5px rgba(74,144,217,0.2), inset 0 -4px 10px rgba(0,0,0,0.04), inset 0 2px 6px rgba(255,255,255,0.4); }
.pet-list-item .pet-list-emoji[data-rarity="史诗"] { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55) 0%, rgba(200,170,255,0.18) 50%, rgba(130,70,200,0.05) 100%); box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 8px rgba(155,89,182,0.25), inset 0 -4px 10px rgba(0,0,0,0.04), inset 0 2px 6px rgba(255,255,255,0.35); }
.pet-list-item .pet-list-emoji[data-rarity="传说"] { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.55) 0%, rgba(255,220,150,0.22) 50%, rgba(200,140,30,0.06) 100%); box-shadow: 0 2px 8px rgba(0,0,0,0.06), 0 0 10px rgba(243,156,18,0.35), inset 0 -4px 10px rgba(0,0,0,0.04), inset 0 2px 6px rgba(255,255,255,0.35); }

.pet-list-item .pet-list-name {
  flex: 1;
  font-size: 14px;
  font-weight: bold;
}

.pet-list-item .pet-list-status {
  font-size: 12px;

}

/* ===== 宠物商店 ===== */
.shop-tabs {
  display: flex;
  gap: 8px;
}

.shop-tab-btn {
  padding: 8px 20px;
  border: 2px solid var(--border);
  background: var(--bg-card);
  border-radius: 20px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  transition: var(--transition);

}

.shop-tab-btn.active {
  background: var(--primary);

}

.shop-grid {

  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 16px;
}

.shop-item {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 20px 16px;

}

.shop-item:hover {

}

.shop-item.owned {

}

.shop-item.owned::after {

.shop-item-emoji {

  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.65) 0%, rgba(255,255,255,0.15) 45%, rgba(0,0,0,0.04) 100%);
  border-radius: 50%;
  padding: 8px 12px;
  transform: rotateX(6deg) rotateY(-4deg);
  box-shadow: 0 4px 14px rgba(0,0,0,0.08), inset 0 -6px 16px rgba(0,0,0,0.05), inset 0 3px 8px rgba(255,255,255,0.45);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.3s;
}
.shop-item-emoji:hover {

}
@keyframes shopEmojiPop {

  100% { transform: rotateX(0) rotateY(0) scale(1.22); }
}
/* 商店稀有度光晕 */
.shop-item-emoji[data-rarity="稀有"] { box-shadow: 0 4px 14px rgba(0,0,0,0.08), 0 0 8px rgba(74,144,217,0.25), inset 0 -6px 16px rgba(0,0,0,0.05), inset 0 3px 8px rgba(255,255,255,0.45); }
.shop-item-emoji[data-rarity="史诗"] { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.6) 0%, rgba(200,170,255,0.2) 45%, rgba(130,70,200,0.08) 100%); box-shadow: 0 4px 14px rgba(0,0,0,0.08), 0 0 12px rgba(155,89,182,0.3), inset 0 -6px 16px rgba(0,0,0,0.05), inset 0 3px 8px rgba(255,255,255,0.4); }
.shop-item-emoji[data-rarity="传说"] { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.6) 0%, rgba(255,220,150,0.25) 45%, rgba(200,140,30,0.1) 100%); box-shadow: 0 4px 16px rgba(0,0,0,0.08), 0 0 15px rgba(243,156,18,0.4), inset 0 -6px 16px rgba(0,0,0,0.05), inset 0 3px 8px rgba(255,255,255,0.4); }

.shop-item-name {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 4px;
}

.shop-item-desc {
  font-size: 12px;

  margin-bottom: 8px;
  min-height: 32px;

}

.shop-item-rarity {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 10px;
}

.shop-growth-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: bold;
  background: #E8F8F5;
  color: #1ABC9C;

}

.shop-item-price {

}

.shop-buy-btn {

  border-radius: 20px;

  font-size: 14px;

  cursor: pointer;

}

.shop-buy-btn:hover:not(:disabled) {

}

.shop-buy-btn:disabled {

/* 食物卡片 */
.food-item {

}

.food-stats {

.food-stat {

.food-stat.hunger { background: #FFE5E5; color: #C0392B; }

/* ===== 学习天地 ===== */
.subject-tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.subject-tab-btn {
  padding: 10px 24px;
  border: 2px solid var(--border);
  background: var(--bg-card);
  border-radius: 20px;
  cursor: pointer;
  font-size: 16px;
  font-weight: bold;
  transition: var(--transition);
  font-family: inherit;
  color: var(--text-soft);
}

.subject-tab-btn.active {

.learn-daily-banner {

  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, #FFF9E6, #FFF3CD);

  border-radius: 14px;
  padding: 12px 18px;
  margin-bottom: 20px;

}
.learn-daily-banner .learn-daily-icon { font-size: 24px; }
.learn-daily-banner .learn-daily-text { flex: 1; color: #8B6914; font-weight: 600; }
.learn-daily-banner .learn-daily-progress {
  background: #FFD54F;
  color: #5D4037;
  padding: 4px 14px;
  border-radius: 20px;

}

.learn-section {

}

.learn-section-title {

.learn-section-title .badge {

}

.learn-section-title .badge.review {

.learn-section-title .badge.preview {

}

.learn-grid {

.learn-card {

  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: var(--transition);
  border: 2px solid transparent;
}

.learn-card:hover {

.learn-card.completed {

.learn-card-header {

}

.learn-card-icon {

.learn-card-title {

}

.learn-card-desc {

.learn-card-type {

.learn-card.completed .learn-card-type {

}

.learn-card-reward {

}

.stat-card {
  background: var(--bg-card);
  border-radius: var(--radius-lg);
  padding: 20px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
}

.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.stat-card .stat-icon {
  font-size: 36px;
  display: block;
  margin-bottom: 8px;
}

.stat-card .stat-value {
  font-size: 28px;
  font-weight: bold;
  color: var(--primary);
}

.stat-card .stat-label {
  font-size: 13px;
  color: var(--text-soft);
  margin-top: 4px;
}

.achievements-section {
  margin-bottom: 30px;
}

.achievements-section h3 {
  font-size: 20px;
  margin-bottom: 16px;
}

.achievements-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
}

.achievement-card {
  background: var(--bg-card);
  border-radius: var(--radius-md);
  padding: 16px;
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: var(--transition);
  border: 2px solid transparent;
}

.achievement-card.unlocked {
  border-color: var(--accent);
  background: linear-gradient(135deg, #FFFBF0, #FFF8E1);
}

.achievement-card.locked {
  opacity: 0.5;
  filter: grayscale(0.7);
}

.achievement-card .ach-icon {
  font-size: 40px;
  display: block;
  margin-bottom: 8px;
}

.achievement-card .ach-name {
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 4px;
}

.achievement-card .ach-desc {
  font-size: 11px;
  color: var(--text-soft);
  line-height: 1.3;
}

/* 日历 */
.calendar-section {
  margin-bottom: 20px;
}

.calendar-section h3 {
  font-size: 20px;
  margin-bottom: 16px;
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  background: var(--bg-card);
  padding: 16px;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
}

.calendar-weekday {
  text-align: center;
  font-size: 12px;
  font-weight: bold;
  color: var(--text-soft);
  padding: 4px;
}

.calendar-day {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 10px;
  font-size: 14px;
  font-weight: bold;
  background: var(--bg-soft);
  color: var(--text-soft);
  position: relative;
}

.calendar-day.checked {
  background: linear-gradient(135deg, var(--success), #55EFC4);
  color: white;
}

.calendar-day.checked::after {
  content: '✓';
  position: absolute;
  font-size: 18px;
}

.calendar-day.today {
  border: 2px solid var(--primary);
}

.calendar-day.empty {
  background: transparent;
}

/* ===== 弹窗 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  z-index: 1000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-overlay.active {
  display: flex;
  animation: fadeIn 0.3s ease;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-content {
  background: var(--bg-card);
  border-radius: var(--radius-xl);
  padding: 30px;
  max-width: 600px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: modalSlideUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes modalSlideUp {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  font-size: 22px;
}

.modal-close {
  background: var(--bg-soft);
  border: none;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  font-size: 20px;
  cursor: pointer;
  transition: var(--transition);
  display: flex;
  align-items: center;
  justify-content: center;
}

.modal-close:hover {
  background: var(--danger);
  color: white;
}

/* 闪卡 */
.flashcard-container {
  perspective: 1000px;
  margin: 20px auto;
  width: 100%;
  max-width: 400px;
}

.flashcard {
  width: 100%;
  height: 250px;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.6s;
  cursor: pointer;
}

.flashcard.flipped {
  transform: rotateY(180deg);
}

.flashcard-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.flashcard-front {
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
}

.flashcard-back {
  background: linear-gradient(135deg, var(--accent), #F0B429);
  color: white;
  transform: rotateY(180deg);
}

.flashcard-text {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 8px;
}

.flashcard-hint {
  font-size: 13px;
  opacity: 0.8;
}

.flashcard-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 16px;
}

.flashcard-counter {
  font-size: 14px;
  color: var(--text-soft);
  font-weight: bold;
}

.flashcard-nav-btn {

/* 测验 */
.quiz-question {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 16px;
  line-height: 1.5;
}

.quiz-options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.quiz-option {
  padding: 14px 18px;
  background: var(--bg-soft);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  font-size: 15px;
  font-weight: 500;
  text-align: left;
  font-family: inherit;
}

.quiz-option:hover {
  border-color: var(--primary-light);
  background: var(--bg-card);
}

.quiz-option.correct {
  background: #D4EDDA;
  border-color: var(--success);
  color: #155724;
}

.quiz-option.wrong {
  background: #F8D7DA;
  border-color: var(--danger);
  color: #721C24;
}

.quiz-option:disabled {
  cursor: not-allowed;
}

.quiz-feedback {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: var(--radius-md);
  font-size: 14px;
  text-align: center;
  display: none;
}

.quiz-feedback.show {
  display: block;
  animation: fadeInUp 0.3s ease;
}

.quiz-feedback.correct {
  background: #D4EDDA;
  color: #155724;
}

.quiz-feedback.wrong {
  background: #F8D7DA;
  color: #721C24;
}

.quiz-next-btn {
  display: block;
  margin: 16px auto 0;
  padding: 10px 30px;
  border: none;
  border-radius: 20px;
  background: linear-gradient(135deg, var(--primary), var(--primary-light));
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: var(--transition);
  font-family: inherit;
  display: none;
}

.quiz-next-btn.show {
  display: block;
  animation: fadeInUp 0.3s ease;
}

.quiz-next-btn:hover {
  transform: scale(1.05);
}

/* 练习（数学运算）*/
.practice-question {
  font-size: 32px;
  font-weight: bold;
  text-align: center;
  margin: 20px 0;
  color: var(--primary);
}

.practice-input {
  display: flex;

  justify-content: center;
  align-items: center;
  margin-bottom: 16px;
}

.practice-input input {
  width: 120px;
  padding: 12px 16px;
  border: 3px solid var(--border);
  border-radius: var(--radius-md);
  font-size: 22px;
  font-weight: bold;
  text-align: center;
  font-family: inherit;
  transition: var(--transition);
}

.practice-input input:focus {
  outline: none;
  border-color: var(--primary);
}

.practice-input input.correct {

}

.practice-input input.wrong {

}

@keyframes shake {
  0%, 100% { transform: translateX(0); }

}

.practice-submit {
  padding: 10px 24px;

  border-radius: 20px;

  font-size: 15px;
  font-weight: bold;

}

}

.practice-progress {

  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-soft);

}

.practice-hint {

  font-size: 13px;
  color: var(--text-soft);
  margin-bottom: 12px;

/* 喂食弹窗 */
.feed-modal {

}

.feed-pet-info {

  margin-bottom: 20px;
}

.feed-pet-info .feed-pet-emoji {

  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.2) 40%, rgba(0,0,0,0.05) 100%);

  padding: 10px 14px;
  transform: rotateX(7deg) rotateY(-5deg);
  box-shadow: 0 4px 16px rgba(0,0,0,0.1), inset 0 -8px 18px rgba(0,0,0,0.06), inset 0 4px 10px rgba(255,255,255,0.5);

}
.feed-pet-info .feed-pet-emoji:hover {
  transform: rotateX(0) rotateY(0) scale(1.18);

}
.feed-pet-info .feed-pet-emoji[data-rarity="传说"] { background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.65) 0%, rgba(255,220,150,0.28) 40%, rgba(200,140,30,0.12) 100%); box-shadow: 0 4px 16px rgba(0,0,0,0.1), 0 0 16px rgba(243,156,18,0.4), inset 0 -8px 18px rgba(0,0,0,0.06), inset 0 4px 10px rgba(255,255,255,0.45); }

.feed-pet-info .feed-pet-name {
  font-size: 18px;
  font-weight: bold;
  margin-top: 8px;
}

.food-options {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.food-option {
  display: flex;

  align-items: center;
  gap: 4px;
  padding: 14px;
  background: var(--bg-soft);
  border: 2px solid var(--border);
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: var(--transition);
  text-align: center;
}

.food-option:hover:not(.disabled) {
  border-color: var(--primary-light);
  background: var(--bg-card);
  transform: translateY(-2px);
}

.food-option.disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.food-option .food-emoji {

}

.food-option .food-name {

}

.food-option .food-price {

}

.food-option .food-effect {

}

/* ===== Toast 提示 ===== */
.toast-container {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
  pointer-events: none;
}

.toast {
  padding: 12px 28px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: bold;
  color: white;
  box-shadow: var(--shadow-lg);
  animation: toastSlideDown 0.4s ease, toastFadeOut 0.4s ease 2s forwards;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }
.toast.warning { background: var(--accent); color: var(--text-main); }

@keyframes toastSlideDown {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes toastFadeOut {
  to {
    opacity: 0;
    transform: translateY(-20px);
  }
}

/* ===== 金币飞行动画 ===== */
#coin-fly-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1500;
}

.coin-fly {
  position: fixed;
  font-size: 28px;
  pointer-events: none;
  animation: coinFly 1s ease-in forwards;
}

@keyframes coinFly {
  0% {
    opacity: 1;
    transform: scale(0.5);
  }
  50% {
    opacity: 1;
    transform: scale(1.5) translateY(-100px);
  }
  100% {
    opacity: 0;
    transform: scale(1) translateY(-200px);
  }
}

/* ===== 彩纸动画 ===== */
#confetti-container {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 1500;
  overflow: hidden;
}

.confetti {
  position: absolute;
  width: 10px;
  height: 10px;
  pointer-events: none;
  animation: confettiFall 2s linear forwards;
}

@keyframes confettiFall {
  0% {
    transform: translateY(-20px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(100vh) rotate(720deg);
    opacity: 0;
  }
}

/* ===== 完成全部任务动画 ===== */
.all-done-banner {

/* ===== 响应式 ===== */
@media (max-width: 600px) {
  /* 顶部栏：紧凑水平排列，不换行 */
  .topbar {
    flex-direction: row;

    justify-content: space-between;
  }

    gap: 2px;

  }

  }

  .streak-display {

    flex-shrink: 0;
  }

  }

  .settings-entry-btn {
    width: 26px;
    height: 26px;
    font-size: 13px;
    flex-shrink: 0;
  }

    flex-wrap: nowrap;

    padding: 10px 8px 6px;
    gap: 6px;

    scrollbar-width: none; /* Firefox */

  .tab-nav::-webkit-scrollbar {

  }

  .tab-btn {
    min-width: 64px;
    padding: 8px 10px;
    flex-shrink: 0;

  .tab-icon { font-size: 20px; }

  .shop-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .learn-grid {
    grid-template-columns: 1fr;
  }

  .food-options {
    grid-template-columns: 1fr;
  }
}

function getTasks() {
  return state.tasksConfig || DAILY_TASKS;
}

// 每日学习内容轮换：根据日期从学习列表中选出当天的内容
function getDailyLearnItems(items, count) {
  if (!items || items.length === 0) return [];
  if (items.length <= count) return items;
  const today = todayStr();
  let hash = 0;
  for (let i = 0; i < today.length; i++) {
    hash = (hash * 31 + today.charCodeAt(i)) & 0x7fffffff;
  }
  const offset = hash % items.length;
  const result = [];
  for (let i = 0; i < Math.min(count, items.length); i++) {
    result.push(items[(offset + i) % items.length]);
  }
  return result;
}

// ==================== LocalStorage ====================
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('保存失败:', e);
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      state = { ...state, ...JSON.parse(saved) };
    }
    // 兼容旧数据：给没有 adoptedAt 的宠物补上时间戳
    if (state.petStates) {
      Object.keys(state.petStates).forEach(petId => {
        if (!state.petStates[petId].adoptedAt) {
          state.petStates[petId].adoptedAt = state.petStates[petId].lastUpdate || Date.now();
        }
      });
    }
    // 兼容旧数据：确保公司结构存在
    if (!state.company) state.company = { level: 1, totalEarned: 0, employees: {} };
    if (!state.company.employees) state.company.employees = {};
  } catch (e) {
    console.error('加载失败:', e);
  }
}

// ==================== 工具函数 ====================
function todayStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function getDaysBetween(date1, date2) {
  const d1 = new Date(date1);
  const d2 = new Date(date2);
  return Math.round((d2 - d1) / (1000 * 60 * 60 * 24));
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icons = { success: '✅', error: '❌', info: '💡', warning: '⚠️' };
  toast.innerHTML = `<span>${icons[type] || '💡'}</span><span>${message}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 2800);
}

function flyCoins(x, y, count = 3) {
  const container = document.getElementById('coin-fly-container');
  for (let i = 0; i < count; i++) {

    coin.className = 'coin-fly';
    coin.textContent = '🪙';
    coin.style.left = (x + (Math.random() - 0.5) * 60) + 'px';
    coin.style.top = y + 'px';
    coin.style.animationDelay = (i * 0.1) + 's';
    container.appendChild(coin);
    setTimeout(() => coin.remove(), 1200);
  }

function launchConfetti() {

  for (let i = 0; i < 60; i++) {

    confetti.style.left = Math.random() * 100 + '%';

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };

// ==================== 日期与打卡 ====================
function updateDateDisplay() {
  const d = new Date();
  const weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  document.getElementById('date-display').textContent =
    `${d.getMonth() + 1}月${d.getDate()}日 ${weekdays[d.getDay()]}`;
}

function checkDailyReset() {
  const today = todayStr();
  if (state.lastActiveDate !== today) {
    // 检查连续天数
    if (state.lastActiveDate) {
      const diff = getDaysBetween(state.lastActiveDate, today);
      if (diff === 1) {
        state.streak += 1;
      } else if (diff > 1) {
        state.streak = 1;
      }
    } else {
      state.streak = 1;
    }
    state.lastActiveDate = today;

    // 添加打卡日期
    if (!state.checkInDates.includes(today)) {
      state.checkInDates.push(today);
    }

    // 宠物属性衰减
    decayAllPets();

    // 每日重置学习进度（可重复赚金币）
    const todayLearn = Object.keys(state.learningProgress).filter(k => state.learningProgress[k]).length;
    state.totalLearnAllTime = (state.totalLearnAllTime || 0) + todayLearn;
    state.learningProgress = {};
    state.learnResetDate = today;

    saveState();
  } else if (state.learnResetDate !== today) {
    // 兜底：如果日期不一致但没触发上面的逻辑
    const todayLearn = Object.keys(state.learningProgress).filter(k => state.learningProgress[k]).length;
    state.totalLearnAllTime = (state.totalLearnAllTime || 0) + todayLearn;
    state.learningProgress = {};
    state.learnResetDate = today;
    saveState();
  }
}

// ==================== 宠物系统 ====================
function decayAllPets() {
  const now = Date.now();
  Object.keys(state.petStates).forEach(petId => {
    const ps = state.petStates[petId];
    if (!ps) return;
    const hoursPassed = (now - ps.lastUpdate) / (1000 * 60 * 60);
    ps.hunger = Math.max(0, ps.hunger - hoursPassed * 8);
    ps.happiness = Math.max(0, ps.happiness - hoursPassed * 5);
    ps.energy = Math.max(0, ps.energy - hoursPassed * 1);
    ps.lastUpdate = now;
  });
  saveState();
}

function initPetState(petId) {
  state.petStates[petId] = {
    hunger: 80,
    happiness: 80,
    energy: 80,
    lastUpdate: Date.now(),
    adoptedAt: Date.now(),
  };
}

// 获取宠物成长阶段
function getPetGrowthStage(petId) {
  const ps = state.petStates[petId];
  if (!ps || !ps.adoptedAt) return 'adult';
  const growth = PET_GROWTH[petId];
  if (!growth) return 'adult';
  const hoursOwned = (Date.now() - ps.adoptedAt) / (1000 * 60 * 60);
  if (hoursOwned < growth.babyHours) return 'baby';
  if (hoursOwned < growth.youngHours) return 'young';
  return 'adult';
}

// 获取宠物当前形态的emoji
function getPetGrowthEmoji(petId) {
  const growth = PET_GROWTH[petId];
  if (!growth) return PETS.find(p => p.id === petId)?.emoji || '🐾';
  const stage = getPetGrowthStage(petId);
  return growth[stage] || PETS.find(p => p.id === petId)?.emoji || '🐾';
}

// 获取宠物展示HTML（成年期有图片的用img标签，否则用emoji）
function getPetDisplayHtml(petId) {
  const pet = PETS.find(p => p.id === petId);
  const growth = PET_GROWTH[petId];
  const stage = getPetGrowthStage(petId);
  const rarity = pet?.rarity || '普通';
  if (growth && stage === 'adult' && growth.adultImage) {
    return `<div class="pet-3d-wrapper" data-rarity="${rarity}">
      <img src="${growth.adultImage}" class="pet-adult-img" alt="宠物形象" 
      onerror="this.style.display='none';this.nextElementSibling.style.display='inline';"
      /><span class="pet-emoji-large" style="display:none">${growth.adult}</span>
    </div>`;
  }
  const emoji = getPetGrowthEmoji(petId);
  return `<div class="pet-3d-wrapper" data-rarity="${rarity}"><span class="pet-emoji-large">${emoji}</span></div>`;
}

// 获取成长阶段中文名
function getGrowthStageLabel(petId) {
  const stage = getPetGrowthStage(petId);
  const map = { baby: '🌱 幼崽期', young: '🌿 少年期', adult: '🌳 成年期' };
  return map[stage] || '🌳 成年期';
}

// 获取距离下一阶段的时间描述
function getGrowthProgress(petId) {
  const ps = state.petStates[petId];
  if (!ps || !ps.adoptedAt) return '';
  const growth = PET_GROWTH[petId];
  if (!growth) return '';
  const stage = getPetGrowthStage(petId);
  const hoursOwned = (Date.now() - ps.adoptedAt) / (1000 * 60 * 60);

  if (stage === 'baby') {
    const remaining = Math.max(0, growth.babyHours - hoursOwned);
    const pct = Math.min(100, (hoursOwned / growth.babyHours) * 100);
    const remainingStr = remaining < 1 ? `${Math.round(remaining * 60)}分钟` : `${Math.round(remaining)}小时`;
    return { label: `→ 少年期还需 ${remainingStr}`, pct: pct };
  }
  if (stage === 'young') {
    const remaining = Math.max(0, growth.youngHours - hoursOwned);
    const elapsed = hoursOwned - growth.babyHours;
    const span = growth.youngHours - growth.babyHours;
    const pct = Math.min(100, (elapsed / span) * 100);
    const remainingStr = remaining < 1 ? `${Math.round(remaining * 60)}分钟` : `${Math.round(remaining)}小时`;
    return { label: `→ 成年期还需 ${remainingStr}`, pct: pct };
  }
  return { label: '已成年 🎉', pct: 100 };
}

function getPetMood(petState) {
  if (!petState) return { emoji: '😴', text: '未知' };
  const avg = (petState.hunger + petState.happiness + petState.energy) / 3;
  if (avg >= 70) return { emoji: '😊', text: '开心' };
  if (avg >= 40) return { emoji: '😐', text: '一般' };
  if (petState.hunger < 30) return { emoji: '🥺', text: '好饿啊...' };
  if (petState.happiness < 30) return { emoji: '😢', text: '不开心...' };
  return { emoji: '😰', text: '需要照顾' };
}

// 检查宠物进化并通知
function checkPetEvolution() {
  if (!state.pets.length) return;
  if (!state.petEvoNotified) state.petEvoNotified = {};

  state.pets.forEach(pid => {
    const growth = PET_GROWTH[pid];
    if (!growth) return;
    const ps = state.petStates[pid];
    if (!ps || !ps.adoptedAt) return;

    const hoursOwned = (Date.now() - ps.adoptedAt) / (1000 * 60 * 60);

    // 检查是否刚进入少年期
    if (hoursOwned >= growth.babyHours && !state.petEvoNotified[pid + '_young']) {
      state.petEvoNotified[pid + '_young'] = true;
      const name = getPetDisplayName(pid);
      showToast(`🎉 ${name} 从幼崽成长为少年期了！`, 'success');
      launchConfetti();
    }
    // 检查是否刚进入成年期
    if (hoursOwned >= growth.youngHours && !state.petEvoNotified[pid + '_adult']) {
      state.petEvoNotified[pid + '_adult'] = true;
      const name = getPetDisplayName(pid);
      showToast(`🎊 ${name} 成年了！它变得更厉害了！`, 'success');
      launchConfetti();
    }
  });
  saveState();
}

function renderPetHome() {
  const container = document.getElementById('pet-home-content');

  if (state.pets.length === 0) {
    container.innerHTML = `
      <div class="pet-home-empty">
        <span class="empty-icon">🐾</span>
        <h3>还没有宠物哦~</h3>
        <p>去商店买一只可爱的宠物吧！</p>
        <button class="btn-primary" onclick="switchTab('shop')">🛒 去商店逛逛</button>
      </div>
    `;
    return;
  }

  // 确保有选中宠物

  `;

function recyclePet(petId) {
  const pet = PETS.find(p => p.id === petId);
  if (!pet) return;
  const refund = Math.floor(pet.price / 2);
  const petName = getPetDisplayName(petId);

  // 返还金币
  state.coins += refund;
  // 移除宠物
  state.pets = state.pets.filter(id => id !== petId);
  delete state.petStates[petId];
  if (state.petNames) delete state.petNames[petId];
  // 切换激活宠物
  if (state.activePetId === petId) {
    state.activePetId = state.pets.length > 0 ? state.pets[0] : null;
  }

  saveState();
  updateCoinDisplay();
  closeModal();
  renderPetHome();
  renderShop();
  checkAchievements();
  showToast(`${petName} 回收成功，获得 ${refund}🪙`, 'success');
  launchConfetti();
}

function buyAndFeed(petId, foodId) {
  const food = PET_FOODS.find(f => f.id === foodId);
  if (!food) return;
  if (state.coins < food.price) {
    showToast('金币不够啦！去完成任务赚金币吧~', 'warning');
    return;
  }

  state.coins -= food.price;
  const ps = state.petStates[petId] || initPetState(petId);
  ps.hunger = Math.min(100, ps.hunger + food.hunger);
  ps.happiness = Math.min(100, ps.happiness + food.happiness);
  ps.energy = Math.min(100, ps.energy + (food.energy || 0));
  ps.lastUpdate = Date.now();
  state.petStates[petId] = ps;

  saveState();
  updateCoinDisplay();
  closeFeedModal();
  renderPetHome();
  showToast(`${getPetDisplayName(petId)} 吃了${food.name}，好开心！${food.emoji}`, 'success');

  // 喂食互动动画
  triggerFeedAnimation(petId, food);
}

// 喂食互动动画
function triggerFeedAnimation(petId, food) {
  const petArea = document.getElementById('pet-display-area');
  const petEl = document.getElementById('pet-main-emoji');
  if (!petArea || !petEl) return;

  // 1. 宠物跳动
  petArea.classList.add('animating');
  petEl.style.animation = 'none';
  petEl.offsetHeight;
  petEl.style.animation = 'feedBounce 0.6s ease';

  // 2. 飘出爱心
  spawnHearts(petArea);

  // 3. 飘出食物粒子
  spawnParticles(petArea, food.emoji);

  // 4. 说话气泡
  showPetBubble(petArea, getRandomFeedReaction());

  setTimeout(() => {
    petEl.style.animation = 'petBounce 2s ease-in-out infinite';
    petArea.classList.remove('animating');
  }, 700);
}

function spawnHearts(container) {
  const heartEmojis = ['❤️', '💕', '💖', '💗', '💝', '😍'];
  for (let i = 0; i < 6; i++) {
    setTimeout(() => {
      const heart = document.createElement('span');
      heart.className = 'floating-heart';
      heart.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      heart.style.left = (30 + Math.random() * 40) + '%';
      heart.style.animationDuration = (1 + Math.random() * 1.5) + 's';
      heart.style.animationDelay = '0s';
      heart.style.fontSize = (16 + Math.random() * 20) + 'px';
      container.appendChild(heart);
      setTimeout(() => heart.remove(), 2000);
    }, i * 80);
  }
}

function spawnParticles(container, foodEmoji) {
  const particles = ['✨', '💫', '⭐', foodEmoji, foodEmoji];
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const p = document.createElement('span');
      p.className = 'feed-particle';
      p.textContent = particles[i];
      p.style.left = (25 + Math.random() * 50) + '%';
      p.style.animationDuration = (0.8 + Math.random() * 0.8) + 's';
      container.appendChild(p);
      setTimeout(() => p.remove(), 1800);
    }, i * 60);
  }
}

function showPetBubble(container, text) {
  const bubble = document.createElement('div');
  bubble.className = 'pet-speech-bubble';
  bubble.textContent = text;

  // Position above the pet
  const existing = container.querySelector('.pet-speech-bubble');
  if (existing) existing.remove();

  container.appendChild(bubble);
  setTimeout(() => bubble.remove(), 2000);
}

function playWithPet(petId) {

  state.petStates[petId] = ps;

  renderPetHome();
  showToast(`和${getPetDisplayName(petId)}玩了一会儿，它好开心！🎾`, 'success');

function getAdultPetCount() {
  return state.pets.filter(pid => getPetGrowthStage(pid) === 'adult').length;
}

// 升级费用：指数增长 200 × 1.6^(等级-1)
function companyUpgradeCost() {
  return Math.floor(200 * Math.pow(1.6, state.company.level - 1));
}

// 单只宠物待领取工资（离线累计，封顶12小时）
function pendingEarnings(petId) {
  const comp = state.company;
  const emp = comp.employees[petId];
  if (!emp) return 0;
  const hours = Math.min(12, (Date.now() - emp.lastEarn) / 3600000);
  const job = COMPANY_JOBS.find(j => j.id === emp.job);
  const wage = (job ? job.baseWage : 1) * comp.level;
  return Math.floor(hours * wage);
}

function totalPending() {
  return Object.keys(state.company.employees).reduce((sum, id) => sum + pendingEarnings(id), 0);
}

function jobActionText(action) {
  const map = {
    singer: '🎤 拿话筒唱歌中…',

    courier: '📦 扛包裹搬运中…',
    cleaner: '🧹 挥扫把清洁中…',
  };
  return map[action] || '工作中…';
}

// 打开派遣弹窗
let dispatchSelectedJob = null;
function openDispatchModal() {

  renderDispatchModal();
  document.getElementById('dispatch-overlay').classList.add('active');
}
function closeDispatchModal() {
  document.getElementById('dispatch-overlay').classList.remove('active');
}
function renderDispatchModal() {
  const content = document.getElementById('dispatch-content');
  const workingIds = Object.keys(state.company.employees);
  const available = state.pets.filter(pid => !workingIds.includes(pid));
  const jobCards = COMPANY_JOBS.map(j => `
    <button class="dispatch-job ${dispatchSelectedJob === j.id ? 'selected' : ''}" onclick="dispatchSelectJob('${j.id}')">
      <span class="dispatch-job-emoji">${j.emoji}</span>
      <span class="dispatch-job-name">${j.name}</span>
      <span class="dispatch-job-wage">时薪 ${j.baseWage}×Lv</span>
      <span class="dispatch-job-desc">${j.desc}</span>
    </button>`).join('');
  const petCards = available.length ? available.map(pid => {
    const p = PETS.find(x => x.id === pid);
    const stage = getGrowthStageLabel(pid);
    const gEmoji = getPetGrowthEmoji(pid);
    const disabled = !dispatchSelectedJob;
    return `<button class="dispatch-pet ${disabled ? 'disabled' : ''}" onclick="dispatchAssign('${pid}')" ${disabled ? 'disabled' : ''}>
      <div class="pet-3d-wrapper" data-rarity="${p.rarity || '普通'}"><span class="pet-emoji-large">${gEmoji}</span></div>
      <span class="dispatch-pet-name">${getPetDisplayName(pid)}</span>
      <span class="dispatch-pet-stage">${stage}</span>
    </button>`;
  }).join('') : `<p class="dispatch-empty">所有宠物都在上班啦！去把他们换下来吧~</p>`;

  content.innerHTML = `
    <div class="modal-header">
      <h2>🏢 派遣宠物上班</h2>

    <div class="dispatch-jobs">${jobCards}</div>
    <h3 class="dispatch-section-title">🐾 选择宠物</h3>
    <div class="dispatch-pets">${petCards}</div>
  `;
}
function dispatchSelectJob(jobId) {
  dispatchSelectedJob = jobId;
  renderDispatchModal();
}
function dispatchAssign(petId) {
  if (!dispatchSelectedJob) { showToast('请先选择一个岗位', 'warning'); return; }
  state.company.employees[petId] = { job: dispatchSelectedJob, lastEarn: Date.now() };
  saveState();
  closeDispatchModal();
  const job = COMPANY_JOBS.find(j => j.id === dispatchSelectedJob);
  showToast(`🎉 ${getPetDisplayName(petId)} 上岗当${job.name}啦！`, 'success');
  renderCompany();
}

// 一键领工资（离线累计，封顶12小时；上班消耗体力，体力耗尽自动下班）
function collectSalary() {
  const comp = state.company;
  const now = Date.now();
  let total = 0;
  const toRemove = [];
  Object.keys(comp.employees).forEach(petId => {
    const emp = comp.employees[petId];
    const hours = Math.min(12, (now - emp.lastEarn) / 3600000);
    const job = COMPANY_JOBS.find(j => j.id === emp.job);
    const wage = (job ? job.baseWage : 1) * comp.level;
    total += Math.floor(hours * wage);
    const ps = state.petStates[petId];
    if (ps) {
      ps.energy = Math.max(0, ps.energy - Math.min(ps.energy, hours * 2));
      ps.lastUpdate = now;
      if (ps.energy <= 0) toRemove.push(petId);
    }
    emp.lastEarn = now;
  });
  toRemove.forEach(id => delete comp.employees[id]);
  if (total > 0) {
    addCoins(total);
    comp.totalEarned = (comp.totalEarned || 0) + total;
    saveState();

    launchConfetti();
  } else {
    showToast('暂时还没有可领取的工资哦~', 'info');
  }
  renderCompany();
}

function buyPet(petId) {
  const pet = PETS.find(p => p.id === petId);
  if (!pet) return;
  if (state.coins < pet.price) {
    showToast('金币不够啦！', 'warning');
    return;
  }
  if (state.pets.includes(petId)) {
    showToast('已经拥有这只宠物了~', 'info');
    return;
  }

  state.coins -= pet.price;
  state.pets.push(petId);
  initPetState(petId);
  if (!state.activePetId) state.activePetId = petId;

  saveState();
  updateCoinDisplay();
  renderShop();
  checkAchievements();
  showToast(`恭喜获得 ${pet.emoji} ${pet.name}！`, 'success');
  launchConfetti();
}

function buyFood(foodId) {
  const food = PET_FOODS.find(f => f.id === foodId);
  if (!food) return;
  if (state.coins < food.price) {
    showToast('金币不够啦！', 'warning');
    return;
  }
  state.coins -= food.price;
  state.foodInventory[foodId] = (state.foodInventory[foodId] || 0) + 1;
  saveState();
  updateCoinDisplay();
  renderShop();
  showToast(`购买了 ${food.emoji} ${food.name}！`, 'success');
}

// ==================== 任务系统 ====================
function renderTasks() {
  const container = document.getElementById('task-groups');
  const today = todayStr();
  const todayTasks = state.tasks[today] || {};

  // 按分类分组
  const groups = {};
  getTasks().forEach(task => {
    if (!groups[task.category]) groups[task.category] = [];
    groups[task.category].push(task);
  });

  let html = '';
  Object.entries(groups).forEach(([catKey, tasks]) => {
    const cat = TASK_CATEGORIES[catKey];
    const doneCount = tasks.filter(t => todayTasks[t.id]).length;
    html += `
      <div class="task-group">
        <div class="task-group-header">
          <span class="group-icon">${cat.icon}</span>
          <span class="group-name">${cat.name}</span>
          <span class="group-count">${doneCount} / ${tasks.length}</span>
        </div>
        <div class="task-list">
          ${tasks.map(task => {
            const done = todayTasks[task.id];
            return `
              <div class="task-card ${done ? 'completed' : ''}" onclick="toggleTask('${task.id}', event)">
                <div class="task-checkbox">${done ? '✓' : ''}</div>
                <span class="task-icon">${task.icon}</span>
                <div class="task-info">
                  <div class="task-name">${task.name}</div>
                </div>
                <div class="task-reward">🪙 +${task.reward}</div>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    `;
  });

  container.innerHTML = html;

  // 检查是否全部完成
  const allDone = getTasks().every(t => todayTasks[t.id]);
  if (allDone) {
    const banner = document.createElement('div');
    banner.className = 'all-done-banner';
    banner.innerHTML = `
      <span class="banner-icon">🎉</span>
      <h3>太棒了！今天的任务全部完成！</h3>
      <p>你真是个自律的好孩子！继续加油~</p>
    `;
    container.insertBefore(banner, container.firstChild);
    if (!state.allTasksInOneDay) {
      state.allTasksInOneDay = true;
      saveState();
      checkAchievements();
    }
  }

  updateDailySummary();
}

function toggleTask(taskId, event) {
  const today = todayStr();
  if (!state.tasks[today]) state.tasks[today] = {};
  const wasDone = state.tasks[today][taskId];

  if (wasDone) {
    // 取消完成（退回金币）
    state.tasks[today][taskId] = false;
    const task = getTasks().find(t => t.id === taskId);
    state.coins = Math.max(0, state.coins - task.reward);
    saveState();
    updateCoinDisplay();
  } else {
    // 完成任务
    state.tasks[today][taskId] = true;
    const task = getTasks().find(t => t.id === taskId);
    state.totalTasksDone += 1;

    // 获取点击位置
    let x = window.innerWidth / 2, y = window.innerHeight / 2;
    if (event && event.currentTarget) {
      const rect = event.currentTarget.getBoundingClientRect();
      x = rect.left + rect.width / 2;
      y = rect.top;
    }

    addCoins(task.reward, x, y);
    showToast(`${task.icon} ${task.name} 完成！+${task.reward}🪙`, 'success');
  }

  saveState();
  renderTasks();
  checkAchievements();
}

function updateDailySummary() {
  const today = todayStr();
  const todayTasks = state.tasks[today] || {};
  const doneCount = getTasks().filter(t => todayTasks[t.id]).length;
  const earned = getTasks().filter(t => todayTasks[t.id]).reduce((sum, t) => sum + t.reward, 0);
  const totalReward = getTasks().reduce((sum, t) => sum + t.reward, 0);
  const remaining = totalReward - earned;

  document.getElementById('daily-progress-text').textContent = `${doneCount} / ${getTasks().length}`;
  document.getElementById('daily-progress-fill').style.width = (doneCount / getTasks().length * 100) + '%';
  document.getElementById('today-earned').textContent = earned;
  document.getElementById('today-done').textContent = doneCount;
  document.getElementById('today-remaining').textContent = remaining;

  // 更新连续天数
  document.getElementById('streak-count').textContent = state.streak;
}

}

function openLearnActivity(itemId, type, title) {
  const overlay = document.getElementById('modal-overlay');
  const content = document.getElementById('modal-content');

  if (type === 'flashcard') {
    openFlashcard(itemId, title, overlay, content);
  } else if (type === 'quiz') {
    openQuiz(itemId, title, overlay, content);
  } else if (type === 'practice' || type === 'word_problem') {
    openPractice(itemId, title, overlay, content);
  } else if (type === 'reading') {
    openReading(itemId, title, overlay, content);
  }
}

// --- 闪卡 ---
function openFlashcard(itemId, title, overlay, content) {
  const cards = FLASHCARDS[itemId] || [];
  if (cards.length === 0) {
    showToast('暂无内容', 'warning');
    return;
  }

  let currentIdx = 0;
  let flipped = false;

  function renderCard() {
    const card = cards[currentIdx];
    content.innerHTML = `
      <div class="modal-header">
        <h2>🎴 ${title}</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="flashcard-container">
        <div class="flashcard ${flipped ? 'flipped' : ''}" onclick="flipCard()">
          <div class="flashcard-face flashcard-front">
            <div class="flashcard-text">${card.front}</div>
            <div class="flashcard-hint">👆 点击翻牌</div>
          </div>
          <div class="flashcard-face flashcard-back">
            <div class="flashcard-text">${card.back}</div>
            <div class="flashcard-hint">👆 点击翻回</div>
          </div>
        </div>
      </div>
      <div class="flashcard-nav">
        <button class="flashcard-nav-btn" onclick="prevCard()" ${currentIdx === 0 ? 'disabled' : ''}>⬅ 上一张</button>
        <span class="flashcard-counter">${currentIdx + 1} / ${cards.length}</span>
        <button class="flashcard-nav-btn" onclick="nextCard()" ${currentIdx === cards.length - 1 ? 'disabled' : ''}>下一张 ➡</button>
      </div>
      ${currentIdx === cards.length - 1 ? `
        <div style="text-align:center;margin-top:16px;">
          <button class="btn-primary" onclick="finishLearn('${itemId}')">完成学习 +5🪙</button>
        </div>
      ` : ''}
    `;
  }

  window.flipCard = () => { flipped = !flipped; renderCard(); };
  window.prevCard = () => { if (currentIdx > 0) { currentIdx--; flipped = false; renderCard(); } };
  window.nextCard = () => { if (currentIdx < cards.length - 1) { currentIdx++; flipped = false; renderCard(); } };

  renderCard();
  overlay.classList.add('active');
}

// --- 测验 ---
function openQuiz(itemId, title, overlay, content) {
  const questions = QUIZZES[itemId] || [];
  if (questions.length === 0) {
    showToast('暂无内容', 'warning');
    return;
  }

  let qIdx = 0;
  let correctCount = 0;
  let answered = false;

  function renderQuestion() {
    const q = questions[qIdx];
    answered = false;
    content.innerHTML = `
      <div class="modal-header">
        <h2>❓ ${title}</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="practice-progress">第 ${qIdx + 1} / ${questions.length} 题 | 已答对 ${correctCount} 题</div>
      <div class="quiz-question">${q.q}</div>
      <div class="quiz-options">
        ${q.options.map((opt, i) => `
          <button class="quiz-option" onclick="answerQuiz(${i})">${opt}</button>
        `).join('')}
      </div>
      <div class="quiz-feedback" id="quiz-feedback"></div>
      <button class="quiz-next-btn" id="quiz-next-btn" onclick="nextQuestion()">
        ${qIdx < questions.length - 1 ? '下一题 ➡' : '完成测验 🎉'}
      </button>
    `;
  }

  window.answerQuiz = (selected) => {
    if (answered) return;
    answered = true;
    const q = questions[qIdx];
    const options = document.querySelectorAll('.quiz-option');
    options.forEach((opt, i) => {
      opt.disabled = true;
      if (i === q.answer) opt.classList.add('correct');
      if (i === selected && i !== q.answer) opt.classList.add('wrong');
    });

    const feedback = document.getElementById('quiz-feedback');
    const nextBtn = document.getElementById('quiz-next-btn');
    if (selected === q.answer) {
      correctCount++;
      feedback.className = 'quiz-feedback show correct';
      feedback.textContent = '✅ 答对了！真棒！';
    } else {
      feedback.className = 'quiz-feedback show wrong';
      feedback.textContent = `❌ 答错了，正确答案是：${q.options[q.answer]}`;
    }
    nextBtn.classList.add('show');
  };

  window.nextQuestion = () => {
    if (qIdx < questions.length - 1) {
      qIdx++;
      renderQuestion();
    } else {
      // 测验结束
      const isPerfect = correctCount === questions.length;
      if (isPerfect) {
        state.perfectQuizzes++;
      }
      const reward = isPerfect ? 8 : correctCount >= questions.length * 0.6 ? 5 : 2;
      if (!state.learningProgress[itemId]) {
        state.learningProgress[itemId] = true;
        state.learningCompleted++;
        addCoins(reward);
      }
      // 已完成的项目不再重复加钱
      saveState();
      checkAchievements();

      content.innerHTML = `
        <div class="modal-header">
          <h2>🎉 测验完成！</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:60px;margin-bottom:16px;">${isPerfect ? '🏆' : '👏'}</div>
          <div style="font-size:28px;font-weight:bold;color:var(--primary);margin-bottom:8px;">
            答对 ${correctCount} / ${questions.length} 题
          </div>
          <div style="font-size:18px;color:var(--text-soft);margin-bottom:16px;">
            ${isPerfect ? '全对！太厉害了！' : correctCount >= questions.length * 0.6 ? '不错哦，继续加油！' : '没关系，多练习就会进步！'}
          </div>
          <div style="font-size:22px;font-weight:bold;color:#B8860B;margin-bottom:20px;">
            🪙 +${reward}
          </div>
          ${isPerfect ? '<div style="font-size:16px;color:var(--success);margin-bottom:20px;">⭐ 全对奖励翻倍！</div>' : ''}
          <button class="btn-primary" onclick="closeModal(); renderLearn();">完成</button>
        </div>
      `;
      if (isPerfect) launchConfetti();
    }
  };

  renderQuestion();
  overlay.classList.add('active');
}

// --- 练习（数学运算）---
function openPractice(itemId, title, overlay, content) {
  const problems = generateMathProblems(itemId);
  if (problems.length === 0) {
    // 非生成的题型用闪卡或测验
    showToast('该内容即将上线', 'info');
    return;
  }

  let pIdx = 0;
  let correctCount = 0;

  function renderProblem() {
    const p = problems[pIdx];
    const isTime = p.isTime;
    content.innerHTML = `
      <div class="modal-header">
        <h2>✏️ ${title}</h2>
        <button class="modal-close" onclick="closeModal()">✕</button>
      </div>
      <div class="practice-progress">第 ${pIdx + 1} / ${problems.length} 题 | 已答对 ${correctCount} 题</div>
      ${p.hint ? `<div class="practice-hint">💡 ${p.hint}</div>` : ''}
      <div class="practice-question">${p.q}</div>
      <div class="practice-input">
        <input type="text" inputmode="${isTime ? 'text' : 'decimal'}" id="practice-answer" 
          placeholder="${isTime ? '输入答案' : '?'}" 
          onkeydown="if(event.key==='Enter') submitPractice()" autocomplete="off">
        <button class="practice-submit" onclick="submitPractice()">提交</button>
      </div>
      <div class="quiz-feedback" id="practice-feedback"></div>
      <button class="quiz-next-btn" id="practice-next-btn" onclick="nextProblem()">
        ${pIdx < problems.length - 1 ? '下一题 ➡' : '完成练习 🎉'}
      </button>
    `;
    document.getElementById('practice-answer').focus();
  }

  window.submitPractice = () => {
    const input = document.getElementById('practice-answer');
    const feedback = document.getElementById('practice-feedback');
    const nextBtn = document.getElementById('practice-next-btn');
    const p = problems[pIdx];
    const rawVal = input.value.trim();

    if (!rawVal) {
      showToast('请输入答案', 'warning');
      return;
    }

    let isCorrect = false;
    if (p.isTime) {
      // 灵活匹配：时间题 "3点整" / "3点" / "3点0分" / "6点半" / "6点30分"
      // 以及有余数除法 "5...余2" / "5余2" / "5...2"
      const normalize = (s) => s.replace(/[点整时分余\.]/g, '').replace('半', '30').replace('…', '').trim();
      const userNorm = normalize(rawVal);
      const ansNorm = normalize(p.answer);
      isCorrect = userNorm === ansNorm || rawVal === p.answer;
    } else {
      const userAns = parseFloat(rawVal);
      if (isNaN(userAns)) {
        showToast('请输入数字答案', 'warning');
        return;
      }
      isCorrect = userAns === p.answer;
    }

    input.disabled = true;
    if (isCorrect) {
      input.classList.add('correct');
      correctCount++;
      feedback.className = 'quiz-feedback show correct';
      feedback.textContent = '✅ 答对了！真棒！';
    } else {
      input.classList.add('wrong');
      feedback.className = 'quiz-feedback show wrong';
      feedback.textContent = `❌ 答错了，正确答案是：${p.answer}`;
    }
    nextBtn.classList.add('show');
  };

  window.nextProblem = () => {
    if (pIdx < problems.length - 1) {
      pIdx++;
      renderProblem();
    } else {
      const isPerfect = correctCount === problems.length;
      const reward = isPerfect ? 8 : correctCount >= problems.length * 0.6 ? 5 : 2;
      if (!state.learningProgress[itemId]) {
        state.learningProgress[itemId] = true;
        state.learningCompleted++;
        addCoins(reward);
      }
      // 已完成的项目不再重复加钱
      saveState();
      checkAchievements();

      content.innerHTML = `
        <div class="modal-header">
          <h2>🎉 练习完成！</h2>
          <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <div style="text-align:center;padding:20px 0;">
          <div style="font-size:60px;margin-bottom:16px;">${isPerfect ? '🏆' : '👏'}</div>
          <div style="font-size:28px;font-weight:bold;color:var(--primary);margin-bottom:8px;">
            答对 ${correctCount} / ${problems.length} 题
          </div>
          <div style="font-size:18px;color:var(--text-soft);margin-bottom:16px;">
            ${isPerfect ? '全对！数学小天才！' : correctCount >= problems.length * 0.6 ? '不错哦，继续加油！' : '多练习就会进步！'}
          </div>
          <div style="font-size:22px;font-weight:bold;color:#B8860B;margin-bottom:20px;">
            🪙 +${reward}
          </div>
          <button class="btn-primary" onclick="closeModal(); renderLearn();">完成</button>
        </div>
      `;
      if (isPerfect) launchConfetti();
    }
  };

  renderProblem();
  overlay.classList.add('active');
}
