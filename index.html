<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>小学二升三暑假养宠大作战</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 金币飞行动画容器 -->
  <div id="coin-fly-container"></div>

  <!-- 彩纸动画容器 -->
  <div id="confetti-container"></div>

  <!-- ========== 顶部导航栏 ========== -->
  <header class="topbar">
    <div class="topbar-left">
      <h1 class="logo">🐾 暑假养宠大作战</h1>
      <span class="grade-badge">二升三</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-name" id="child-name-display">小朋友</span>
      <div class="coin-display" id="coin-display">
        <span class="coin-icon">🪙</span>
        <span class="coin-amount" id="coin-amount">0</span>
      </div>
      <div class="streak-display" id="streak-display">
        <span>🔥</span>
        <span id="streak-count">0</span>天
      </div>
      <div class="date-display" id="date-display"></div>
      <button class="settings-entry-btn" onclick="openSettings()" title="家长设置">⚙️</button>
    </div>
  </header>

  <!-- ========== 标签导航 ========== -->
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="tasks">
      <span class="tab-icon">📋</span>
      <span class="tab-label">今日任务</span>
    </button>
    <button class="tab-btn" data-tab="pets">
      <span class="tab-icon">🐾</span>
      <span class="tab-label">宠物家园</span>
    </button>
    <button class="tab-btn" data-tab="shop">
      <span class="tab-icon">🛒</span>
      <span class="tab-label">宠物商店</span>
    </button>
    <button class="tab-btn" data-tab="company">
      <span class="tab-icon">🚀</span>
      <span class="tab-label">小小创业家</span>
    </button>
    <button class="tab-btn" data-tab="gacha">
      <span class="tab-icon">🎰</span>
      <span class="tab-label">幸运扭蛋</span>
    </button>
    <button class="tab-btn" data-tab="learn">
      <span class="tab-icon">📚</span>
      <span class="tab-label">学习天地</span>
    </button>
    <button class="tab-btn" data-tab="progress">
      <span class="tab-icon">📊</span>
      <span class="tab-label">成长记录</span>
    </button>
  </nav>

  <!-- ========== 主内容区 ========== -->
  <main class="main-content">

    <!-- ===== 今日任务 ===== -->
    <section class="tab-panel active" id="panel-tasks">
      <div class="panel-header">
        <h2>📋 今日任务</h2>
        <div class="daily-progress">
          <span id="daily-progress-text">0 / 11</span>
          <div class="progress-bar">
            <div class="progress-fill" id="daily-progress-fill" style="width: 0%"></div>
          </div>
        </div>
      </div>
      <div class="task-groups" id="task-groups">
        <!-- 任务卡片由JS生成 -->
      </div>
      <div class="daily-summary" id="daily-summary">
        <div class="summary-card">
          <span class="summary-icon">🪙</span>
          <span>今日已赚：<strong id="today-earned">0</strong> 金币</span>
        </div>
        <div class="summary-card">
          <span class="summary-icon">✅</span>
          <span>已完成：<strong id="today-done">0</strong> 项</span>
        </div>
        <div class="summary-card">
          <span class="summary-icon">🎯</span>
          <span>还可赚：<strong id="today-remaining">28</strong> 金币</span>
        </div>
      </div>
    </section>

    <!-- ===== 宠物家园 ===== -->
    <section class="tab-panel" id="panel-pets">
      <div class="panel-header">
        <h2>🐾 宠物家园</h2>
      </div>
      <div id="pet-home-content">
        <!-- 由JS生成 -->
      </div>
    </section>

    <!-- ===== 宠物商店 ===== -->
    <section class="tab-panel" id="panel-shop">
      <div class="panel-header">
        <h2>🛒 宠物商店</h2>
        <div class="shop-tabs">
          <button class="shop-tab-btn active" data-shop-tab="pets">宠物</button>
          <button class="shop-tab-btn" data-shop-tab="food">食物</button>
        </div>
      </div>
      <div class="shop-content" id="shop-content">
        <!-- 由JS生成 -->
      </div>
    </section>

    <!-- ===== 学习天地 ===== -->
    <section class="tab-panel" id="panel-learn">
      <div class="panel-header">
        <h2>📚 学习天地</h2>
        <p class="panel-subtitle">复习二年级知识 + 预习三年级新内容，完成学习还能赚金币！</p>
      </div>
      <div class="subject-tabs">
        <button class="subject-tab-btn active" data-subject="math">🔢 数学</button>
        <button class="subject-tab-btn" data-subject="chinese">📝 语文</button>
        <button class="subject-tab-btn" data-subject="english">🔤 英语</button>
        <button class="subject-tab-btn" data-subject="reading">📖 阅读</button>
      </div>
      <div class="learn-content" id="learn-content">
        <!-- 由JS生成 -->
      </div>
    </section>

    <!-- ===== 宠物公司 ===== -->
    <section class="tab-panel" id="panel-company">
      <div id="company-content">
        <!-- 由JS生成 -->
      </div>
    </section>

    <!-- ===== 幸运扭蛋 ===== -->
    <section class="tab-panel" id="panel-gacha">
      <div id="gacha-content">
        <!-- 由JS生成 -->
      </div>
    </section>

    <!-- ===== 成长记录 ===== -->
    <section class="tab-panel" id="panel-progress">
      <div class="panel-header">
        <h2>📊 成长记录</h2>
      </div>
      <div class="progress-overview" id="progress-overview">
        <!-- 由JS生成 -->
      </div>
      <div class="achievements-section">
        <h3>🏆 我的成就</h3>
        <div class="achievements-grid" id="achievements-grid">
          <!-- 由JS生成 -->
        </div>
      </div>
      <div class="calendar-section">
        <h3>📅 打卡日历</h3>
        <div class="calendar-grid" id="calendar-grid">
          <!-- 由JS生成 -->
        </div>
      </div>
    </section>

  </main>

  <!-- ========== 弹窗：学习活动 ========== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content" id="modal-content">
      <!-- 由JS生成 -->
    </div>
  </div>

  <!-- ========== 宠物喂食弹窗 ========== -->
  <div class="modal-overlay" id="feed-modal-overlay">
    <div class="modal-content feed-modal" id="feed-modal-content">
      <!-- 由JS生成 -->
    </div>
  </div>

  <!-- ========== 弹窗：家长设置 ========== -->
  <div class="modal-overlay" id="settings-overlay">
    <div class="modal-content" id="settings-content">
      <!-- 由JS生成 -->
    </div>
  </div>

  <!-- ========== 弹窗：宠物改名 ========== -->
  <div class="modal-overlay" id="rename-modal-overlay">
    <div class="modal-content" id="rename-modal-content">
      <!-- 由JS生成 -->
    </div>
  </div>

  <!-- ========== 弹窗：派遣宠物上班 ========== -->
  <div class="modal-overlay" id="dispatch-overlay">
    <div class="modal-content dispatch-modal" id="dispatch-content">
      <!-- 由JS生成 -->
    </div>
  </div>

  <!-- ========== 弹窗：宠物公司改名 ========== -->
  <div class="modal-overlay" id="rename-company-overlay">
    <div class="modal-content rename-company-modal" id="rename-company-content">
      <!-- 由JS生成 -->
    </div>
  </div>

  <!-- ========== Toast 提示 ========== -->
  <div class="toast-container" id="toast-container"></div>

  <!-- ========== 页面底部访问统计 ========== -->
  <div class="page-footer">
    <span class="visit-icon">👀</span>
    <span class="visit-detail" id="busuanzi_container_site_pv"> 本站总访问量 <span id="busuanzi_value_site_pv"></span> 次</span>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js?v=20260805l"></script>
  <script async src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"></script>
</body>
</html>
